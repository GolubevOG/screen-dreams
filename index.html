<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Dreams — Галерея скринсейверов</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <h1 class="header__title">Screen Dreams</h1>
        <p class="header__subtitle">Интерактивные скринсейверы для вашего браузера</p>
    </header>

    <div class="toolbar">
        <div class="filters" id="filters"></div>
        <div class="search-sort">
            <input type="text" class="search" id="search" placeholder="Поиск скринсейверов...">
            <select class="sort" id="sort">
                <option value="name-asc">По имени (А-Я)</option>
                <option value="name-desc">По имени (Я-А)</option>
                <option value="tech">По технологии</option>
            </select>
            <button class="random-btn" id="randomBtn" title="Случайный скринсейвер">🎲</button>
        </div>
    </div>

    <main class="gallery" id="gallery"></main>

    <footer class="footer">
        <p>Сделано с любовью к красивым заставкам — <strong>GolubevOG</strong></p>
    </footer>

    <script src="js/gallery.js"></script>
</body>
</html>

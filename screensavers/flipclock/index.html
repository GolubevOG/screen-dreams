<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlipClock</title>
    <style>
        * { margin: 0; padding: 0; }
        body {
            background: #0d0d1a;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }
        .clock-container {
            display: flex;
            gap: 30px;
            align-items: center;
        }
        .flip-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .flip-card {
            position: relative;
            width: 160px;
            height: 180px;
            perspective: 500px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .flip-card .top,
        .flip-card .bottom {
            position: absolute;
            width: 100%;
            height: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .flip-card .top {
            top: 0;
            background: linear-gradient(180deg, #2a2a4a 0%, #1e1e38 100%);
            border-radius: 12px 12px 0 0;
            border-bottom: 1px solid #000;
        }
        .flip-card .bottom {
            bottom: 0;
            background: linear-gradient(180deg, #1a1a30 0%, #15152a 100%);
            border-radius: 0 0 12px 12px;
        }
        .flip-card .top span {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 110px;
            font-weight: bold;
            color: #00d4ff;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
            top: 50%;
            transform: translateY(-50%);
            line-height: 1;
        }
        .flip-card .bottom span {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 110px;
            font-weight: bold;
            color: #00d4ff;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
            bottom: 50%;
            transform: translateY(50%);
            line-height: 1;
        }
        .flip-card .fold {
            position: absolute;
            width: 100%;
            height: 50%;
            overflow: hidden;
            z-index: 10;
            backface-visibility: hidden;
        }
        .flip-card .fold-top {
            top: 0;
            transform-origin: bottom center;
            background: linear-gradient(180deg, #2a2a4a 0%, #1e1e38 100%);
            border-radius: 12px 12px 0 0;
        }
        .flip-card .fold-top span {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 110px;
            font-weight: bold;
            color: #00d4ff;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
            top: 50%;
            transform: translateY(-50%);
            line-height: 1;
        }
        .flip-card .fold-bottom {
            bottom: 0;
            transform-origin: top center;
            transform: rotateX(90deg);
            background: linear-gradient(180deg, #1a1a30 0%, #15152a 100%);
            border-radius: 0 0 12px 12px;
        }
        .flip-card .fold-bottom span {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 110px;
            font-weight: bold;
            color: #00d4ff;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
            bottom: 50%;
            transform: translateY(50%);
            line-height: 1;
        }
        .flip-card.flipping .fold-top {
            animation: flipDown 0.3s ease-in forwards;
        }
        .flip-card.flipping .fold-bottom {
            animation: flipUp 0.3s 0.3s ease-out forwards;
        }
        @keyframes flipDown {
            0% { transform: rotateX(0deg); }
            100% { transform: rotateX(-90deg); }
        }
        @keyframes flipUp {
            0% { transform: rotateX(90deg); }
            100% { transform: rotateX(0deg); }
        }
        .flip-card .center-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: #000;
            top: 50%;
            transform: translateY(-50%);
            z-index: 20;
        }
        .flip-card .shadow-top {
            position: absolute;
            width: 100%;
            height: 50%;
            top: 50%;
            background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, transparent 100%);
            z-index: 15;
            pointer-events: none;
        }
        .separator {
            font-size: 80px;
            color: #00d4ff;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
            animation: blink 1s infinite;
            margin-top: -30px;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.2; }
        }
        .label {
            font-size: 16px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 4px;
        }
        .date-display {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            color: #444;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s;
        }
        body:hover .controls { opacity: 1; }
        .back-btn, .fullscreen-btn {
            background: rgba(0,212,255,0.08);
            color: #00d4ff;
            padding: 10px 20px;
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(10px);
            text-decoration: none;
            transition: all 0.2s;
        }
        .back-btn:hover, .fullscreen-btn:hover {
            background: rgba(0,212,255,0.15);
            border-color: rgba(0,212,255,0.4);
        }
        .watermark {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: rgba(0,212,255,0.2);
            font-size: 14px;
            font-family: monospace;
            z-index: 100;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="controls">
        <a href="../../index.html" class="back-btn">&#8592; Назад к галерее</a>
        <button class="fullscreen-btn" onclick="toggleFullscreen()">&#9974; Полный экран</button>
    </div>
    <div class="watermark">GolubevOG</div>
    <div class="clock-container">
        <div class="flip-unit">
            <div class="flip-card" id="hours">
                <div class="top"><span id="hours-top">00</span></div>
                <div class="bottom"><span id="hours-bottom">00</span></div>
                <div class="fold fold-top"><span id="hours-fold-top">00</span></div>
                <div class="fold fold-bottom"><span id="hours-fold-bottom">00</span></div>
                <div class="center-line"></div>
                <div class="shadow-top"></div>
            </div>
            <div class="label">Часы</div>
        </div>
        <div class="separator">:</div>
        <div class="flip-unit">
            <div class="flip-card" id="minutes">
                <div class="top"><span id="minutes-top">00</span></div>
                <div class="bottom"><span id="minutes-bottom">00</span></div>
                <div class="fold fold-top"><span id="minutes-fold-top">00</span></div>
                <div class="fold fold-bottom"><span id="minutes-fold-bottom">00</span></div>
                <div class="center-line"></div>
                <div class="shadow-top"></div>
            </div>
            <div class="label">Минуты</div>
        </div>
        <div class="separator">:</div>
        <div class="flip-unit">
            <div class="flip-card" id="seconds">
                <div class="top"><span id="seconds-top">00</span></div>
                <div class="bottom"><span id="seconds-bottom">00</span></div>
                <div class="fold fold-top"><span id="seconds-fold-top">00</span></div>
                <div class="fold fold-bottom"><span id="seconds-fold-bottom">00</span></div>
                <div class="center-line"></div>
                <div class="shadow-top"></div>
            </div>
            <div class="label">Секунды</div>
        </div>
    </div>
    <div class="date-display" id="date"></div>
    <script>
        const state = {
            hours: { current: '', next: '' },
            minutes: { current: '', next: '' },
            seconds: { current: '', next: '' }
        };
        const animating = { hours: false, minutes: false, seconds: false };

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');

            if (s !== state.seconds.current && !animating.seconds) {
                flipCard('seconds', state.seconds.current, s);
            }
            if (m !== state.minutes.current && !animating.minutes) {
                flipCard('minutes', state.minutes.current, m);
            }
            if (h !== state.hours.current && !animating.hours) {
                flipCard('hours', state.hours.current, h);
            }

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('ru-RU', options);
        }

        function flipCard(id, oldVal, newVal) {
            if (animating[id]) return;
            animating[id] = true;

            const card = document.getElementById(id);
            const foldTop = document.getElementById(id + '-fold-top');
            const foldBottom = document.getElementById(id + '-fold-bottom');
            const topSpan = document.getElementById(id + '-top');
            const bottomSpan = document.getElementById(id + '-bottom');

            // Устанавливаем значения для анимации
            foldTop.textContent = oldVal;
            foldBottom.textContent = newVal;

            // top показывает НОВОЕ значение (видно до переворота)
            topSpan.textContent = newVal;
            // bottom показывает СТАРОЕ значение (видно после переворота верхней части)
            bottomSpan.textContent = oldVal;

            // Запускаем анимацию
            card.classList.remove('flipping');
            void card.offsetWidth;
            card.classList.add('flipping');

            setTimeout(() => {
                // После анимации: bottom показывает новое значение
                bottomSpan.textContent = newVal;
                state[id].current = newVal;
                animating[id] = false;
            }, 600);
        }

        // Инициализация
        function init() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');

            ['hours', 'minutes', 'seconds'].forEach(id => {
                const val = id === 'hours' ? h : id === 'minutes' ? m : s;
                document.getElementById(id + '-top').textContent = val;
                document.getElementById(id + '-bottom').textContent = val;
                state[id].current = val;
            });

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('ru-RU', options);
        }

        init();
        setInterval(updateClock, 1000);

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                } else {
                    window.location.href = '../../index.html';
                }
            }
        });
    </script>
</body>
</html>
